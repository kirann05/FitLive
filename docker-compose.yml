services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fitlive
      POSTGRES_USER: fitlive
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - fitlive-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U fitlive']
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/fitlive
      DATABASE_USER: fitlive
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      FITLIVE_BRIDGE_SECRET: ${FITLIVE_BRIDGE_SECRET:?Set a random secret of at least 32 characters}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-fitlive}
    depends_on:
      db:
        condition: service_healthy
volumes:
  fitlive-data:

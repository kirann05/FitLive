name: FitLiveWatch
options:
  bundleIdPrefix: com.fitlive
  deploymentTarget:
    watchOS: '10.0'
targets:
  FitLiveWatch:
    type: application
    platform: watchOS
    sources: [FitLiveWatch, ../shared]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.fitlive.companion.watchkitapp
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_WKApplication: YES
      INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.fitlive.companion
      SWIFT_VERSION: '5.9'

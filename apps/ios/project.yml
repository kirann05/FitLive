name: FitLive
options:
  bundleIdPrefix: com.fitlive
  deploymentTarget:
    iOS: '17.0'
settings:
  SWIFT_VERSION: '5.9'
targets:
  FitLive:
    type: application
    platform: iOS
    sources:
      - FitLive
      - path: ../shared
        excludes: [tests]
    dependencies:
      - target: FitLiveWatch
        embed: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.fitlive.companion
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_NSHealthShareUsageDescription: FitLive reads sleep, resting heart rate, HRV, steps, active energy, workouts and body mass to explain your daily context.
      INFOPLIST_KEY_NSHealthUpdateUsageDescription: FitLive does not write health records.
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      TARGETED_DEVICE_FAMILY: '1'
    entitlements:
      path: FitLive/FitLive.entitlements
      properties:
        com.apple.developer.healthkit: true

  FitLiveWatch:
    type: application
    platform: watchOS
    deploymentTarget: '10.0'
    sources:
      - ../watch/FitLiveWatch
      - path: ../shared
        excludes: [tests]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.fitlive.companion.watchkitapp
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_WKApplication: YES
      INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.fitlive.companion
      INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO

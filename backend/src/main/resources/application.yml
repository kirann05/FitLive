spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fitlive}
    username: ${DATABASE_USER:fitlive}
    password: ${DATABASE_PASSWORD}
  flyway:
    enabled: true
server:
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

fitlive:
  bridge-secret: ${FITLIVE_BRIDGE_SECRET:}
